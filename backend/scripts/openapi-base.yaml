openapi: 3.0.3
info:
  title: Centralized Log Aggregation
  version: 1.0.0
  description: |
    Deployment configuration and usage documentation for centralized log
    aggregation (Loki + Promtail). This file documents the log shipping
    stack, JSON parsing, request_id indexing, retention policy, and how to
    query logs by request_id.

    The actual deployment artifacts live alongside this document:
      - backend/scripts/logging/docker-compose.logging.yml
      - backend/scripts/logging/promtail-config.yml
      - backend/scripts/logging/loki-config.yml

    Containers (backend, indexer) write JSON logs to stdout. Promtail
    scrapes container stdout via the Docker service discovery, parses the
    JSON payload, promotes `request_id` to a Loki label (indexed field),
    and ships entries to Loki. Loki applies a retention policy via its
    compactor configuration.

paths:
  /loki/api/v1/query_range:
    get:
      summary: Query logs by request_id
      description: |
        Search all logs for a given request_id. Because `request_id` is
        promoted to a Loki label, queries are indexed and fast.

        Example (HTTP):
          GET /loki/api/v1/query_range
            ?query={request_id="abc-123"}
            &start=<unix_nano>
            &end=<unix_nano>
            &limit=1000

        Example (LogCLI):
          logcli query '{request_id="abc-123"}' --limit=1000

        Example (Grafana Explore):
          {request_id="abc-123"}

        To follow a request across services (backend + indexer), the same
        request_id label is present on both, so a single selector returns
        the full trace.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: LogQL selector, e.g. `{request_id="abc-123"}`
        - name: start
          in: query
          required: false
          schema:
            type: string
          description: Start time (Unix nanoseconds or RFC3339)
        - name: end
          in: query
          required: false
          schema:
            type: string
          description: End time (Unix nanoseconds or RFC3339)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: Matching log streams
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      resultType:
                        type: string
                        example: streams
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            stream:
                              type: object
                              additionalProperties:
                                type: string
                              example:
                                request_id: abc-123
                                service: backend
                                level: info
                            values:
                              type: array
                              items:
                                type: array
                                items:
                                  type: string
        '400':
          description: Invalid query

components:
  schemas:
    LoggingStack:
      type: object
      description: |
        docker-compose.logging.yml defines the following services:

          loki:
            image: grafana/loki:2.9.6
            ports: ["3100:3100"]
            volumes:
              - ./loki-config.yml:/etc/loki/local-config.yaml:ro
              - loki-data:/loki
            command: -config.file=/etc/loki/local-config.yaml

          promtail:
            image: grafana/promtail:2.9.6
            volumes:
              - /var/lib/docker/containers:/var/lib/docker/containers:ro
              - /var/run/docker.sock:/var/run/docker.sock:ro
              - ./promtail-config.yml:/etc/promtail/config.yml:ro
            command: -config.file=/etc/promtail/config.yml
            depends_on: [loki]

          grafana:
            image: grafana/grafana:10.4.2
            ports: ["3000:3000"]
            environment:
              - GF_AUTH_ANONYMOUS_ENABLED=true
              - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
            depends_on: [loki]

        The backend and indexer containers must be started with the
        `logging` compose project label (or on the same Docker network) so
        Promtail's docker_sd_config discovers them. They emit JSON to stdout.

    PromtailConfig:
      type: object
      description: |
        promtail-config.yml (key excerpts):

          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /tmp/positions.yaml

          clients:
            - url: http://loki:3100/loki/api/v1/push

          scrape_configs:
            - job_name: docker
              docker_sd_configs:
                - host: unix:///var/run/docker.sock
                  refresh_interval: 5s
                  filters:
                    - name: label
                      values: ["com.docker.compose.project=logging"]
              relabel_configs:
                - source_labels: ['__meta_docker_container_name']
                  regex: '/(.*)'
                  target_label: 'container'
                - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
                  target_label: 'service'
              pipeline_stages:
                # Parse the JSON log line emitted by backend/indexer.
                - json:
                    expressions:
                      level: level
                      request_id: request_id
                      message: message
                      timestamp: timestamp
                # Promote request_id to an indexed label for trace following.
                - labels:
                    level:
                    request_id:
                    service:
                # Use the log's own timestamp when present.
                - timestamp:
                    source: timestamp
                    format: RFC3339Nano
                # Emit a clean message line.
                - output:
                    source: message

    LokiConfig:
      type: object
      description: |
        loki-config.yml (key excerpts) — retention policy:

          auth_enabled: false

          server:
            http_listen_port: 3100

          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory

          schema_config:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            retention_period: 720h   # 30 days
            reject_old_samples: true
            reject_old_samples_max_age: 168h

          compactor:
            working_directory: /loki/compactor
            retention_enabled: true
            delete_request_store: filesystem

        Retention: 30 days (720h) enforced by the compactor. Adjust
        `limits_config.retention_period` to change the policy.

    QueryByRequestId:
      type: object
      description: |
        How to search by request_id:

        1. Grafana (http://localhost:3000) -> Explore -> Loki datasource:
             {request_id="abc-123"}
           Add `| json` if you need to filter on parsed fields:
             {request_id="abc-123"} | json | level="error"

        2. LogCLI:
             logcli query '{request_id="abc-123"}' --limit=1000

        3. HTTP API:
             curl -G http://localhost:3100/loki/api/v1/query_range \
               --data-urlencode 'query={request_id="abc-123"}' \
               --data-urlencode 'limit=1000'

        4. Cross-service trace (backend + indexer share request_id):
             {request_id="abc-123"} | json | line_format "{{.service}} {{.message}}"

        Acceptance criteria mapping:
          - Logs shipped from containers: Promtail docker_sd_config
          - Parsed and indexed: json stage + labels stage (request_id)
          - Search by request_id works: label selector queries above
          - Retention policy configured: Loki compactor retention_period